<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name) {
    @case ('code') {
      <polyline points="8 4 2 12 8 20" />
      <polyline points="16 4 22 12 16 20" />
    }
    @case ('layers') {
      <polygon points="12 2 2 8 12 14 22 8 12 2" />
      <polyline points="2 14 12 20 22 14" />
      <polyline points="2 11 12 17 22 11" />
    }
    @case ('grid') {
      <rect x="3" y="3" width="7" height="7" rx="1.4" />
      <rect x="14" y="3" width="7" height="7" rx="1.4" />
      <rect x="14" y="14" width="7" height="7" rx="1.4" />
      <rect x="3" y="14" width="7" height="7" rx="1.4" />
    }
    @case ('server') {
      <rect x="2" y="3" width="20" height="7" rx="1.6" />
      <rect x="2" y="14" width="20" height="7" rx="1.6" />
      <circle cx="6.5" cy="6.5" r="0.6" fill="currentColor" />
      <circle cx="6.5" cy="17.5" r="0.6" fill="currentColor" />
    }
    @case ('figma') {
      <path d="M8 2h4a4 4 0 0 1 0 8H8z" />
      <path d="M8 10h4a4 4 0 1 1-4 4z" />
      <path d="M8 2a4 4 0 1 0 0 8" />
      <circle cx="12" cy="18" r="4" />
    }
    @case ('shield') {
      <path d="M12 2 4 5v6c0 5 3.4 8.4 8 11 4.6-2.6 8-6 8-11V5z" />
      <polyline points="9 12 11.2 14.2 15.5 9.5" />
    }
    @case ('arrow-right') {
      <line x1="4" y1="12" x2="20" y2="12" />
      <polyline points="14 6 20 12 14 18" />
    }
    @case ('check') {
      <polyline points="20 6 9 17 4 12" />
    }
    @case ('mail') {
      <rect x="2" y="4" width="20" height="16" rx="2.2" />
      <polyline points="2 6 12 13 22 6" />
    }
    @case ('phone') {
      <path
        d="M4 5c0-.6.4-1 1-1h3.2c.5 0 .9.3 1 .8l1 3.6c.1.4 0 .9-.4 1.2L7.7 11c1.1 2.4 3 4.3 5.4 5.4l1.4-2.1c.3-.4.8-.5 1.2-.4l3.6 1c.5.1.8.5.8 1V19c0 .6-.4 1-1 1h-1C10.5 20 4 13.5 4 6z"
      />
    }
    @case ('whatsapp') {
      <path
        d="M16.7 14.3c-.3-.1-1.7-.8-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.2-.1.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.1-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5 0-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.6 1.2 2.8c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4z"
      />
      <circle cx="12" cy="12" r="10" />
    }
    @case ('map-pin') {
      <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" />
      <circle cx="12" cy="10" r="2.6" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9.5" />
      <polyline points="12 7 12 12 15.5 14" />
    }
    @case ('users') {
      <circle cx="9" cy="8" r="3.2" />
      <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
      <circle cx="17" cy="8.5" r="2.6" />
      <path d="M15 14.2c2.9.4 4.5 2.5 4.5 5.8" />
    }
    @case ('target') {
      <circle cx="12" cy="12" r="9.5" />
      <circle cx="12" cy="12" r="5.5" />
      <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
    }
    @case ('rocket') {
      <path
        d="M14.5 3.5c3 1 5 3 6 6-3 .4-5.4 1.6-7.4 3.6-2 2-3.2 4.4-3.6 7.4-3-1-5-3-6-6 1-3 3-6 5-8s4-2.8 6-3z"
      />
      <circle cx="14.5" cy="9.5" r="1.6" />
      <path d="M6 15c-2 1-3 3-3 5 2 0 4-1 5-3" />
    }
    @case ('award') {
      <circle cx="12" cy="8" r="5.5" />
      <polyline points="8.2 13 6.5 21 12 18 17.5 21 15.8 13" />
    }
    @case ('sparkles') {
      <path d="M12 3v4M12 17v4M4 12h4M16 12h4" />
      <path d="M6.5 6.5 9 9M15 15l2.5 2.5M17.5 6.5 15 9M9 15l-2.5 2.5" />
    }
    @case ('compass') {
      <circle cx="12" cy="12" r="9.5" />
      <polygon points="15 9 13 13 9 15 11 11 15 9" />
    }
    @case ('pen-tool') {
      <path d="m12 19 7-7 3 3-7 7-3-3z" />
      <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
      <path d="m2 2 7.6 7.6" />
      <circle cx="11" cy="11" r="2" />
    }
  }
</svg>
